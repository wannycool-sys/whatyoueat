    function App() {
      // 기기 자동 저장(localStorage) 불러오기 연동
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('diet_app_profile');
        return saved ? JSON.parse(saved) : {
          gender: 'male', age: 29, height: 175, weight: 72,
          activity: 'moderate', goal: 'lose', useCustomRatio: false,
          customRatio: { c: 45, p: 35, f: 20 }
        };
      });

      const [meals, setMeals] = useState(() => {
        const saved = localStorage.getItem('diet_app_meals');
        return saved ? JSON.parse(saved) : INITIAL_MEALS;
      });

      useEffect(() => {
        localStorage.setItem('diet_app_profile', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('diet_app_meals', JSON.stringify(meals));
      }, [meals]);

      const [activeMealTab, setActiveMealTab] = useState('breakfast');
      const [addMode, setAddMode] = useState('preset');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [customFood, setCustomFood] = useState({
        name: '', amount: 100, unit: 'g', kcal: '', carbs: '', protein: '', fat: ''
      });
      const [customError, setCustomError] = useState('');

      const targets = useMemo(() => {
        const { gender, age, height, weight, activity, goal, useCustomRatio, customRatio } = profile;
        const numWeight = Number(weight) || 0;
        const numHeight = Number(height) || 0;
        const numAge = Number(age) || 0;

        let bmr = (10 * numWeight) + (6.25 * numHeight) - (5 * numAge);
        bmr += (gender === 'male' ? 5 : -161);
        bmr = Math.max(800, Math.round(bmr));

        const actObj = ACTIVITY_LEVELS.find(a => a.id === activity) || ACTIVITY_LEVELS[2];
        const tdee = Math.round(bmr * actObj.factor);

        const goalObj = DIET_GOALS.find(g => g.id === goal) || DIET_GOALS[1];
        const targetKcal = Math.max(1000, tdee + goalObj.calDiff);

        const ratio = useCustomRatio ? customRatio : goalObj.ratio;
        const targetCarbs = Math.round((targetKcal * (ratio.c / 100)) / 4);
        const targetProtein = Math.round((targetKcal * (ratio.p / 100)) / 4);
        const targetFat = Math.round((targetKcal * (ratio.f / 100)) / 9);

        return { bmr, tdee, kcal: targetKcal, carbs: targetCarbs, protein: targetProtein, fat: targetFat, ratio };
      }, [profile]);

      const nutritionTotals = useMemo(() => {
        const summary = {
          total: { kcal: 0, carbs: 0, protein: 0, fat: 0 },
          byMeal: {
            breakfast: { kcal: 0, carbs: 0, protein: 0, fat: 0 },
            lunch: { kcal: 0, carbs: 0, protein: 0, fat: 0 },
            dinner: { kcal: 0, carbs: 0, protein: 0, fat: 0 },
            snack: { kcal: 0, carbs: 0, protein: 0, fat: 0 },
          }
        };

        Object.keys(meals).forEach(mealKey => {
          meals[mealKey].forEach(item => {
            const multiplier = (Number(item.amount) || 0) / (Number(item.baseAmount) || 1);
            const k = item.baseKcal * multiplier;
            const c = item.baseCarbs * multiplier;
            const p = item.baseProtein * multiplier;
            const f = item.baseFat * multiplier;

            summary.byMeal[mealKey].kcal += k;
            summary.byMeal[mealKey].carbs += c;
            summary.byMeal[mealKey].protein += p;
            summary.byMeal[mealKey].fat += f;

            summary.total.kcal += k;
            summary.total.carbs += c;
            summary.total.protein += p;
            summary.total.fat += f;
          });
        });

        const roundObj = (obj) => ({
          kcal: Math.round(obj.kcal),
          carbs: Math.round(obj.carbs * 10) / 10,
          protein: Math.round(obj.protein * 10) / 10,
          fat: Math.round(obj.fat * 10) / 10,
        });

        return {
          total: roundObj(summary.total),
          byMeal: {
            breakfast: roundObj(summary.byMeal.breakfast),
            lunch: roundObj(summary.byMeal.lunch),
            dinner: roundObj(summary.byMeal.dinner),
            snack: roundObj(summary.byMeal.snack),
          }
        };
      }, [meals]);

      const handleProfileChange = (field, value) => {
        setProfile(prev => ({ ...prev, [field]: value }));
      };

      const handleAddPresetFood = (food) => {
        const newItem = {
          uid: `food-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
          name: food.name, baseAmount: food.baseAmount, amount: food.baseAmount,
          unit: food.unit, baseKcal: food.kcal, baseCarbs: food.carbs,
          baseProtein: food.protein, baseFat: food.fat
        };
        setMeals(prev => ({ ...prev, [activeMealTab]: [...prev[activeMealTab], newItem] }));
      };

      const handleAddCustomFood = (e) => {
        e.preventDefault();
        if (!customFood.name.trim()) {
          setCustomError('음식 이름을 입력해 주세요.');
          return;
        }
        const amt = Number(customFood.amount) || 100;
        const c = Number(customFood.carbs) || 0;
        const p = Number(customFood.protein) || 0;
        const f = Number(customFood.fat) || 0;
        const k = customFood.kcal !== '' ? Number(customFood.kcal) : Math.round(c * 4 + p * 4 + f * 9);

        const newItem = {
          uid: `custom-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
          name: customFood.name.trim(), baseAmount: amt, amount: amt,
          unit: customFood.unit, baseKcal: k, baseCarbs: c, baseProtein: p, baseFat: f
        };

        setMeals(prev => ({ ...prev, [activeMealTab]: [...prev[activeMealTab], newItem] }));
        setCustomFood({ name: '', amount: 100, unit: 'g', kcal: '', carbs: '', protein: '', fat: '' });
        setCustomError('');
      };

      const handleUpdateFoodAmount = (mealKey, uid, newAmount) => {
        const parsed = Math.max(0, Number(newAmount));
        setMeals(prev => ({
          ...prev,
          [mealKey]: prev[mealKey].map(item => item.uid === uid ? { ...item, amount: parsed } : item)
        }));
      };

      const handleMultiplyAmount = (mealKey, uid, factor) => {
        setMeals(prev => ({
          ...prev,
          [mealKey]: prev[mealKey].map(item => item.uid === uid ? { ...item, amount: Math.round(item.baseAmount * factor) } : item)
        }));
      };

      const handleRemoveFood = (mealKey, uid) => {
        setMeals(prev => ({
          ...prev,
          [mealKey]: prev[mealKey].filter(item => item.uid !== uid)
        }));
      };

      const handleClearMeal = (mealKey) => {
        setMeals(prev => ({ ...prev, [mealKey]: [] }));
      };

      const handleClearAllMeals = () => {
        setMeals({ breakfast: [], lunch: [], dinner: [], snack: [] });
      };

      const handleLoadSampleMeals = () => {
        setMeals(INITIAL_MEALS);
      };

      const filteredPresets = useMemo(() => {
        return FOOD_PRESETS.filter(food => {
          const matchesCategory = selectedCategory === '전체' || food.category === selectedCategory;
          const matchesSearch = food.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [selectedCategory, searchQuery]);

      const actualMacroRatio = useMemo(() => {
        const cCal = nutritionTotals.total.carbs * 4;
        const pCal = nutritionTotals.total.protein * 4;
        const fCal = nutritionTotals.total.fat * 9;
        const totalMacroCal = cCal + pCal + fCal;

        if (totalMacroCal === 0) return { c: 0, p: 0, f: 0 };
        const c = Math.round((cCal / totalMacroCal) * 100);
        const p = Math.round((pCal / totalMacroCal) * 100);
        const f = Math.max(0, 100 - c - p);
        return { c, p, f };
      }, [nutritionTotals]);

      const feedbacks = useMemo(() => {
        const list = [];
        const { total } = nutritionTotals;
        const kcalPercent = (total.kcal / targets.kcal) * 100;
        const proteinPercent = (total.protein / targets.protein) * 100;

        if (total.kcal === 0) {
          return [{ type: 'info', text: '식단을 추가하면 목표 대비 실시간 영양 밸런스 분석 결과가 여기에 표시됩니다.' }];
        }

        if (kcalPercent < 75) {
          list.push({ type: 'warn', text: `목표 칼로리까지 ${targets.kcal - total.kcal}kcal 더 섭취할 수 있습니다. 에너지가 너무 부족하지 않게 채워주세요.` });
        } else if (kcalPercent <= 105) {
          list.push({ type: 'good', text: '일일 권장 칼로리 범위에 완벽하게 부합하는 훌륭한 식단입니다!' });
        } else {
          list.push({ type: 'alert', text: `목표 칼로리를 ${total.kcal - targets.kcal}kcal 초과했습니다. 간식이나 고열량 반찬의 양을 조금 조절해 보세요.` });
        }

        if (proteinPercent < 80) {
          const diffP = Math.round(targets.protein - total.protein);
          list.push({ type: 'warn', text: `단백질이 ${diffP}g 부족합니다. 닭가슴살 약 ${Math.round(diffP / 0.31)}g 또는 삶은 계란 ${Math.ceil(diffP / 6.3)}개를 추가해 보세요.` });
        } else if (proteinPercent >= 95 && proteinPercent <= 130) {
          list.push({ type: 'good', text: '목표 단백질 섭취량을 충분히 달성하여 근손실 방지 및 근육 합성에 이상적입니다.' });
        }

        return list;
      }, [nutritionTotals, targets]);

      const radius = 68;
      const circumference = 2 * Math.PI * radius;
      const calProgress = Math.min(1.15, nutritionTotals.total.kcal / (targets.kcal || 1));
      const strokeDashoffset = circumference - Math.min(1, calProgress) * circumference;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-16 font-sans">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-100">
                  <Utensils className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-lg sm:text-xl font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">
                    하루 영양 & 식단 계산기
                  </h1>
                  <p className="text-xs text-slate-500 hidden sm:block">
                    실시간 TDEE 기반 맞춤형 탄단지(매크로) 및 식단 밸런스 분석
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleLoadSampleMeals}
                  className="text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium transition flex items-center gap-1.5"
                >
                  <Sparkles className="w-3.5 h-3.5 text-amber-500" />
                  <span>예시 식단</span>
                </button>
                <button
                  onClick={handleClearAllMeals}
                  className="text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-rose-200 hover:bg-rose-50 text-rose-600 font-medium transition flex items-center gap-1.5"
                >
                  <RefreshCw className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">전체 초기화</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              {/* 좌측 컬럼 */}
              <div className="lg:col-span-5 space-y-6">
                <section className="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 relative overflow-hidden">
                  <div className="flex items-center justify-between mb-5">
                    <div className="flex items-center gap-2">
                      <Flame className="w-5 h-5 text-orange-500" />
                      <h2 className="text-base sm:text-lg font-bold text-slate-900">오늘의 영양 대시보드</h2>
                    </div>
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                      목표 탄:단:지 = {targets.ratio.c}:{targets.ratio.p}:{targets.ratio.f}
                    </span>
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-around gap-6 py-2 bg-slate-50/70 rounded-2xl p-4 border border-slate-100">
                    <div className="relative flex items-center justify-center">
                      <svg className="w-40 h-40 -rotate-90 transform">
                        <circle cx="80" cy="80" r={radius} stroke="currentColor" strokeWidth="12" fill="transparent" className="text-slate-200" />
                        <circle
                          cx="80" cy="80" r={radius} stroke="currentColor" strokeWidth="12"
                          strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" fill="transparent"
                          className={`transition-all duration-500 ${nutritionTotals.total.kcal > targets.kcal * 1.05 ? 'text-rose-500' : 'text-emerald-500'}`}
                        />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-xs font-medium text-slate-400">섭취 칼로리</span>
                        <span className="text-2xl font-extrabold text-slate-900 tracking-tight mt-0.5">
                          {nutritionTotals.total.kcal.toLocaleString()}
                        </span>
                        <span className="text-xs text-slate-500 font-medium">
                          / {targets.kcal.toLocaleString()} kcal
                        </span>
                      </div>
                    </div>

                    <div className="w-full sm:w-auto flex-1 space-y-3">
                      <div className="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200/60">
                        <div>
                          <p className="text-xs text-slate-400">기초대사량 (BMR)</p>
                          <p className="text-sm font-bold text-slate-700">{targets.bmr.toLocaleString()} kcal</p>
                        </div>
                        <div className="h-7 w-px bg-slate-200" />
                        <div>
                          <p className="text-xs text-slate-400">유지 칼로리 (TDEE)</p>
                          <p className="text-sm font-bold text-slate-700">{targets.tdee.toLocaleString()} kcal</p>
                        </div>
                      </div>

                      <div className={`p-3.5 rounded-xl border flex items-center justify-between ${
                        targets.kcal - nutritionTotals.total.kcal >= 0
                          ? 'bg-emerald-50/60 border-emerald-200 text-emerald-900'
                          : 'bg-rose-50/60 border-rose-200 text-rose-900'
                      }`}>
                        <div>
                          <p className="text-xs font-medium opacity-75">
                            {targets.kcal - nutritionTotals.total.kcal >= 0 ? '남은 여유 칼로리' : '초과한 칼로리'}
                          </p>
                          <p className="text-lg font-extrabold">
                            {Math.abs(targets.kcal - nutritionTotals.total.kcal).toLocaleString()} kcal
                          </p>
                        </div>
                        <div className="text-right">
                          <span className="text-xs font-bold px-2 py-1 rounded-md bg-white/80 shadow-sm">
                            {Math.round((nutritionTotals.total.kcal / targets.kcal) * 100)}% 달성
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* 탄단지 바 */}
                  <div className="mt-6 space-y-4">
                    <div>
                      <div className="flex justify-between items-end mb-1.5">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                          <span className="text-sm font-bold text-slate-700">탄수화물</span>
                          <span className="text-xs text-slate-400">({actualMacroRatio.c}%)</span>
                        </div>
                        <div className="text-xs font-medium">
                          <span className="text-sm font-extrabold text-blue-600">{nutritionTotals.total.carbs}g</span>
                          <span className="text-slate-400"> / {targets.carbs}g</span>
                          <span className="ml-2 text-slate-500">
                            ({targets.carbs - nutritionTotals.total.carbs >= 0 
                              ? `${Math.round(targets.carbs - nutritionTotals.total.carbs)}g 남음` 
                              : `${Math.round(nutritionTotals.total.carbs - targets.carbs)}g 초과`})
                          </span>
                        </div>
                      </div>
                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div 
                          className={`h-full rounded-full transition-all duration-500 ${nutritionTotals.total.carbs > targets.carbs * 1.1 ? 'bg-rose-500' : 'bg-blue-500'}`}
                          style={{ width: `${Math.min(100, (nutritionTotals.total.carbs / (targets.carbs || 1)) * 100)}%` }}
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1.5">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                          <span className="text-sm font-bold text-slate-700">단백질</span>
                          <span className="text-xs text-slate-400">({actualMacroRatio.p}%)</span>
                        </div>
                        <div className="text-xs font-medium">
                          <span className="text-sm font-extrabold text-emerald-600">{nutritionTotals.total.protein}g</span>
                          <span className="text-slate-400"> / {targets.protein}g</span>
                          <span className="ml-2 text-slate-500">
                            ({targets.protein - nutritionTotals.total.protein >= 0 
                              ? `${Math.round(targets.protein - nutritionTotals.total.protein)}g 남음` 
                              : `${Math.round(nutritionTotals.total.protein - targets.protein)}g 초과`})
                          </span>
                        </div>
                      </div>
                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div 
                          className="h-full bg-emerald-500 rounded-full transition-all duration-500"
                          style={{ width: `${Math.min(100, (nutritionTotals.total.protein / (targets.protein || 1)) * 100)}%` }}
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1.5">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                          <span className="text-sm font-bold text-slate-700">지방</span>
                          <span className="text-xs text-slate-400">({actualMacroRatio.f}%)</span>
                        </div>
                        <div className="text-xs font-medium">
                          <span className="text-sm font-extrabold text-amber-600">{nutritionTotals.total.fat}g</span>
                          <span className="text-slate-400"> / {targets.fat}g</span>
                          <span className="ml-2 text-slate-500">
                            ({targets.fat - nutritionTotals.total.fat >= 0 
                              ? `${Math.round(targets.fat - nutritionTotals.total.fat)}g 남음` 
                              : `${Math.round(nutritionTotals.total.fat - targets.fat)}g 초과`})
                          </span>
                        </div>
                      </div>
                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div 
                          className={`h-full rounded-full transition-all duration-500 ${nutritionTotals.total.fat > targets.fat * 1.15 ? 'bg-rose-500' : 'bg-amber-500'}`}
                          style={{ width: `${Math.min(100, (nutritionTotals.total.fat / (targets.fat || 1)) * 100)}%` }}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-slate-100">
                    <div className="flex justify-between text-xs text-slate-500 mb-1.5">
                      <span className="font-semibold">현재 섭취 칼로리 구성비</span>
                      <span>탄 {actualMacroRatio.c}% : 단 {actualMacroRatio.p}% : 지 {actualMacroRatio.f}%</span>
                    </div>
                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden flex">
                      {nutritionTotals.total.kcal > 0 ? (
                        <>
                          <div style={{ width: `${actualMacroRatio.c}%` }} className="bg-blue-500 transition-all duration-500" />
                          <div style={{ width: `${actualMacroRatio.p}%` }} className="bg-emerald-500 transition-all duration-500" />
                          <div style={{ width: `${actualMacroRatio.f}%` }} className="bg-amber-500 transition-all duration-500" />
                        </>
                      ) : (
                        <div className="w-full bg-slate-200" />
                      )}
                    </div>
                  </div>

                  <div className="mt-5 space-y-2">
                    {feedbacks.map((fb, idx) => (
                      <div 
                        key={idx} 
                        className={`p-3 rounded-xl text-xs sm:text-sm flex items-start gap-2.5 border ${
                          fb.type === 'good' ? 'bg-emerald-50/70 border-emerald-200 text-emerald-800' :
                          fb.type === 'warn' ? 'bg-amber-50/70 border-amber-200 text-amber-800' :
                          fb.type === 'alert' ? 'bg-rose-50/70 border-rose-200 text-rose-800' :
                          'bg-slate-50 border-slate-200 text-slate-600'
                        }`}
                      >
                        {fb.type === 'good' && <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />}
                        {fb.type === 'warn' && <Info className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />}
                        {fb.type === 'alert' && <AlertCircle className="w-4 h-4 text-rose-600 shrink-0 mt-0.5" />}
                        {fb.type === 'info' && <Info className="w-4 h-4 text-slate-400 shrink-0 mt-0.5" />}
                        <span className="leading-relaxed font-medium">{fb.text}</span>
                      </div>
                    ))}
                  </div>
                </section>

                {/* 내 신체 정보 설정 */}
                <section className="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80">
                  <div className="flex items-center gap-2 mb-5">
                    <User className="w-5 h-5 text-emerald-600" />
                    <h2 className="text-base sm:text-lg font-bold text-slate-900">내 신체 정보 및 목표 설정</h2>
                  </div>

                  <div className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">성별</label>
                        <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
                          <button
                            type="button"
                            onClick={() => handleProfileChange('gender', 'male')}
                            className={`py-2 text-xs font-bold rounded-lg transition ${profile.gender === 'male' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                            남성
                          </button>
                          <button
                            type="button"
                            onClick={() => handleProfileChange('gender', 'female')}
                            className={`py-2 text-xs font-bold rounded-lg transition ${profile.gender === 'female' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                          >
                            여성
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">나이 (만)</label>
                        <div className="relative">
                          <input
                            type="number" min="10" max="100" value={profile.age}
                            onChange={(e) => handleProfileChange('age', e.target.value)}
                            className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                          />
                          <span className="absolute right-3.5 top-2 text-xs text-slate-400 font-medium">세</span>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">키 (신장)</label>
                        <div className="relative">
                          <input
                            type="number" min="100" max="230" value={profile.height}
                            onChange={(e) => handleProfileChange('height', e.target.value)}
                            className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                          />
                          <span className="absolute right-3.5 top-2 text-xs text-slate-400 font-medium">cm</span>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">몸무게 (체중)</label>
                        <div className="relative">
                          <input
                            type="number" min="30" max="200" step="0.5" value={profile.weight}
                            onChange={(e) => handleProfileChange('weight', e.target.value)}
                            className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                          />
                          <span className="absolute right-3.5 top-2 text-xs text-slate-400 font-medium">kg</span>
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">
                        <Activity className="w-3.5 h-3.5 text-slate-400" />
                        <span>평소 활동량</span>
                      </label>
                      <select
                        value={profile.activity}
                        onChange={(e) => handleProfileChange('activity', e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                      >

                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">

                              key={g.id} type="button" onClick={() => handleProfileChange('goal', g.id)}
                              className={`p-3 rounded-xl border text-left transition flex items-center justify-between ${
                                isSelected ? 'bg-emerald-50/70 border-emerald-500 ring-1 ring-emerald-500' : 'bg-slate-50/60 border-slate-200 hover:bg-slate-100/70'
                              }`}
                            >
                              <div>
                                <div className="text-xs sm:text-sm font-bold text-slate-800">{g.label}</div>
                                <div className="text-xs text-slate-500 mt-0.5">{g.desc}</div>
                              </div>
                              <span className="text-xs font-bold px-2 py-1 rounded-md bg-white border border-slate-200 text-slate-700">
                                {g.ratio.c}:{g.ratio.p}:{g.ratio.f}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </section>
              </div>

              {/* 우측 컬럼 */}
              <div className="lg:col-span-7 space-y-6">
                <section className="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                      <Scale className="w-5 h-5 text-emerald-600" />
                      <span>끼니별 식단 기록 및 조절</span>
                    </h2>
                    <span className="text-xs text-slate-400 hidden sm:inline">
                      수량(g/ml)을 수정하면 즉시 영양 성분이 재계산됩니다
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-6">
                    {MEAL_TYPES.map(meal => {
                      const Icon = meal.icon;
                      const isActive = activeMealTab === meal.id;
                      const mealStat = nutritionTotals.byMeal[meal.id];
                      const itemCount = meals[meal.id].length;

                      return (
                        <button
                          key={meal.id} type="button" onClick={() => setActiveMealTab(meal.id)}
                          className={`p-3.5 rounded-xl border text-left transition relative overflow-hidden ${
                            isActive ? 'bg-slate-900 text-white border-slate-900 shadow-md' : 'bg-slate-50/70 hover:bg-slate-100 text-slate-700 border-slate-200'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1.5">
                            <div className="flex items-center gap-1.5">
                              <Icon className={`w-4 h-4 ${isActive ? 'text-emerald-400' : meal.color}`} />
                              <span className="font-bold text-sm">{meal.label}</span>
                            </div>
                            <span className={`text-xs px-1.5 py-0.5 rounded-full font-semibold ${isActive ? 'bg-slate-800 text-slate-300' : 'bg-slate-200/70 text-slate-600'}`}>
                              {itemCount}개
                            </span>
                          </div>
                          <div className="text-base font-extrabold tracking-tight">
                            {mealStat.kcal.toLocaleString()} <span className="text-xs font-normal opacity-75">kcal</span>
                          </div>
                          <div className={`text-[11px] mt-0.5 truncate ${isActive ? 'text-slate-300' : 'text-slate-400'}`}>
                            탄 {mealStat.carbs}g · 단 {mealStat.protein}g · 지 {mealStat.fat}g
                          </div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="bg-slate-50/80 rounded-2xl p-4 border border-slate-200/70">
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-extrabold text-slate-800">
                          {MEAL_TYPES.find(m => m.id === activeMealTab)?.label} 식단 목록
                        </span>
                        <span className="text-xs text-slate-500 font-medium">
                          (총 {nutritionTotals.byMeal[activeMealTab].kcal.toLocaleString()} kcal)
                        </span>
                      </div>
                      {meals[activeMealTab].length > 0 && (
                        <button
                          type="button" onClick={() => handleClearMeal(activeMealTab)}
                          className="text-xs text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                          <span>이 끼니 비우기</span>
                        </button>
                      )}
                    </div>

                    {meals[activeMealTab].length === 0 ? (
                      <div className="py-10 text-center">
                        <Utensils className="w-8 h-8 text-slate-300 mx-auto mb-2" />
                        <p className="text-sm font-semibold text-slate-500">아직 추가된 음식이 없습니다.</p>
                        <p className="text-xs text-slate-400 mt-1">아래의 프리셋 목록이나 직접 입력을 통해 음식을 담아보세요!</p>
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {meals[activeMealTab].map(item => {
                          const mult = (Number(item.amount) || 0) / (Number(item.baseAmount) || 1);
                          const curKcal = Math.round(item.baseKcal * mult);
                          const curC = Math.round(item.baseCarbs * mult * 10) / 10;
                          const curP = Math.round(item.baseProtein * mult * 10) / 10;
                          const curF = Math.round(item.baseFat * mult * 10) / 10;

                          return (
                            <div key={item.uid} className="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-slate-300 transition">
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2">
                                  <h4 className="font-bold text-slate-800 text-sm truncate">{item.name}</h4>
                                  <span className="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">
                                    {curKcal} kcal
                                  </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500 mt-1">
                                  <span>기준: {item.baseAmount}{item.unit}당 {item.baseKcal}kcal</span>
                                  <span className="text-slate-300">|</span>
                                  <span className="text-blue-600 font-medium">탄 {curC}g</span>
                                  <span className="text-emerald-600 font-medium">단 {curP}g</span>
                                  <span className="text-amber-600 font-medium">지 {curF}g</span>
                                </div>
                              </div>

                              <div className="flex items-center justify-between sm:justify-end gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                                <div className="flex items-center gap-1">
                                  {[0.5, 1, 1.5, 2].map(factor => {
                                    const isCurrentFactor = Math.round(item.baseAmount * factor) === Number(item.amount);
                                    return (
                                      <button
                                        key={factor} type="button" onClick={() => handleMultiplyAmount(activeMealTab, item.uid, factor)}
                                        className={`px-2 py-1 rounded-md text-[11px] font-bold transition ${isCurrentFactor ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                      >
                                        {factor}x
                                      </button>
                                    );
                                  })}
                                </div>

                                <div className="relative w-24">
                                  <input
                                    type="number" min="0" step="10" value={item.amount}
                                    onChange={(e) => handleUpdateFoodAmount(activeMealTab, item.uid, e.target.value)}
                                    className="w-full pl-2.5 pr-7 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-extrabold text-slate-800 text-right focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                  />
                                  <span className="absolute right-2 top-1.5 text-xs text-slate-400 font-medium">{item.unit}</span>
                                </div>

                                <button
                                  type="button" onClick={() => handleRemoveFood(activeMealTab, item.uid)}
                                  className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition"
                                >
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </section>

                {/* 음식 추가 섹션 */}
                <section className="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                    <div className="flex items-center gap-2">
                      <Plus className="w-5 h-5 text-emerald-600" />
                      <h2 className="text-base sm:text-lg font-bold text-slate-900">
                        <span className="text-emerald-600">[{MEAL_TYPES.find(m => m.id === activeMealTab)?.label}]</span>에 음식 추가하기
                      </h2>
                    </div>

                    <div className="flex p-1 bg-slate-100 rounded-xl self-start sm:self-auto">
                      <button
                        type="button" onClick={() => setAddMode('preset')}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${addMode === 'preset' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        <Search className="w-3.5 h-3.5" />
                        <span>추천 음식 프리셋</span>
                      </button>
                      <button
                        type="button" onClick={() => setAddMode('custom')}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${addMode === 'custom' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        <Edit3 className="w-3.5 h-3.5" />
                        <span>직접 영양소 입력</span>
                      </button>
                    </div>
                  </div>

                  {addMode === 'preset' ? (
                    <div>
                      <div className="flex flex-col sm:flex-row gap-2.5 mb-4">
                        <div className="relative flex-1">
                          <Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5" />
                          <input
                            type="text" placeholder="음식 이름 검색 (예: 닭가슴살, 현미밥, 김치찌개...)"
                            value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                          />
                        </div>
                        <div className="flex gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                          {['전체', '단백질/다이어트', '탄수화물/주식', '일반 한식', '과일/간식'].map(cat => (
                            <button
                              key={cat} type="button" onClick={() => setSelectedCategory(cat)}
                              className={`px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                              {cat}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-96 overflow-y-auto pr-1">
                        {filteredPresets.map(food => (
                          <div key={food.id} className="p-3 rounded-xl border border-slate-200/80 hover:border-emerald-400 hover:bg-emerald-50/20 transition flex items-center justify-between gap-2 group">
                            <div className="min-w-0">
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold text-sm text-slate-800 truncate">{food.name}</span>
                                <span className="text-[11px] text-slate-400 font-medium shrink-0">({food.baseAmount}{food.unit})</span>
                              </div>
                              <div className="text-xs text-slate-500 mt-1 flex items-center gap-2">
                                <span className="font-bold text-slate-700">{food.kcal}kcal</span>
                                <span>·</span>
                                <span className="text-blue-600">탄 {food.carbs}g</span>
                                <span className="text-emerald-600">단 {food.protein}g</span>
                                <span className="text-amber-600">지 {food.fat}g</span>
                              </div>
                            </div>

                            <button
                              type="button" onClick={() => handleAddPresetFood(food)}
                              className="shrink-0 px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 group-hover:bg-emerald-600 group-hover:text-white font-bold text-xs transition flex items-center gap-1"
                            >
                              <Plus className="w-3.5 h-3.5" />
                              <span>담기</span>
                            </button>
                          </div>
                        ))}

                        {filteredPresets.length === 0 && (
                          <div className="col-span-2 py-8 text-center text-slate-400 text-sm">
                            검색 결과가 없습니다. '직접 영양소 입력' 탭을 이용해 추가해 보세요!
                          </div>
                        )}
                      </div>
                    </div>
                  ) : (
                    <form onSubmit={handleAddCustomFood} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                      {customError && (
                        <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold rounded-lg">
                          {customError}
                        </div>
                      )}

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-semibold text-slate-600 mb-1">음식 이름 *</label>
                          <input
                            type="text" placeholder="예: 서브웨이 로스트치킨, 프로틴바"
                            value={customFood.name} onChange={(e) => setCustomFood({ ...customFood, name: e.target.value })}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">1회 제공 중량/용량</label>
                          <div className="flex">
                            <input
                              type="number" min="1" value={customFood.amount}
                              onChange={(e) => setCustomFood({ ...customFood, amount: e.target.value })}
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-l-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                            />
                            <select
                              value={customFood.unit} onChange={(e) => setCustomFood({ ...customFood, unit: e.target.value })}
                              className="px-2 py-2 bg-slate-100 border border-l-0 border-slate-200 rounded-r-lg text-xs font-bold text-slate-700"
                            >
                              <option value="g">g</option>
                              <option value="ml">ml</option>
                              <option value="개">개</option>
                              <option value="인분">인분</option>
                            </select>
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-blue-600 mb-1">탄수화물 (g)</label>
                          <input
                            type="number" min="0" step="0.1" placeholder="0" value={customFood.carbs}
                            onChange={(e) => setCustomFood({ ...customFood, carbs: e.target.value })}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-emerald-600 mb-1">단백질 (g)</label>
                          <input
                            type="number" min="0" step="0.1" placeholder="0" value={customFood.protein}
                            onChange={(e) => setCustomFood({ ...customFood, protein: e.target.value })}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-amber-600 mb-1">지방 (g)</label>
                          <input
                            type="number" min="0" step="0.1" placeholder="0" value={customFood.fat}
                            onChange={(e) => setCustomFood({ ...customFood, fat: e.target.value })}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">칼로리 (비워두면 자동)</label>
                          <input
                            type="number" min="0" placeholder="자동 계산" value={customFood.kcal}
                            onChange={(e) => setCustomFood({ ...customFood, kcal: e.target.value })}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end pt-1">
                        <button
                          type="submit"
                          className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-sm transition flex items-center gap-1.5"
                        >
                          <Plus className="w-4 h-4" />
                          <span>{MEAL_TYPES.find(m => m.id === activeMealTab)?.label} 식단에 추가</span>
                        </button>
                      </div>
                    </form>
                  )}
                </section>
              </div>

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
